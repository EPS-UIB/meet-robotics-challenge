<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200mm" height="90mm" viewBox="0 0 200 90">
  <title>Calibratge d'encaixos per contraxapat de 3 mm</title>
  <desc>Prova de nou amplades acabades i tres unions planes de 8 mm.</desc>
  <metadata>Units: mm. Red = CUT, blue = SCORE/ENGRAVE. Cut paths are kerf-compensated for 0.15 mm kerf.</metadata>
  <style>
    .cut { fill:none; stroke:#ff0000; stroke-width:0.10; vector-effect:non-scaling-stroke; }
    .score { fill:none; stroke:#0066ff; stroke-width:0.10; vector-effect:non-scaling-stroke; }
    .label { fill:#0066ff; font-family:Arial,sans-serif; font-size:3px; }
    .note { fill:#333; font-family:Arial,sans-serif; font-size:3.2px; }
    .dim { fill:none; stroke:#555; stroke-width:0.20; marker-start:url(#arrow); marker-end:url(#arrow); }
    .ghost { fill:#d9b77b; fill-opacity:0.58; stroke:#714d20; stroke-width:0.45; }
    .top { fill:#e2c184; fill-opacity:1; stroke:#714d20; stroke-width:0.45; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker>
  </defs>

